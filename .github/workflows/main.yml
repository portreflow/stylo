name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

jobs:
  linux-debug:
    name: Linux (Debug)
    runs-on: [self-hosted, linux, small]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Debug build
        run: cargo build --workspace
      - name: Run Tests
        run: cargo test --workspace
        env:
          RUST_BACKTRACE: 1

  linux-release:
    name: Linux (Release)
    runs-on: [self-hosted, linux, small]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Release build
        run: cargo build --release --features servo
        env:
          RUST_BACKTRACE: 1

  # NOTE (portreflow/stylo private mirror): the macOS and Windows jobs were removed
  # to stay within the Free-plan Actions budget (macOS bills at 10x). Stylo's shared
  # crates are still built/tested end-to-end through servo's CI. Restore these jobs
  # if self-hosted runners are added.

  build-result:
    name: Result
    runs-on: [self-hosted, linux, small]
    if: ${{ always() }}
    needs:
      - linux-debug
      - linux-release
    steps:
      - name: Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: exit 0
      - name: Failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
